<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malibu Rescue Quiz - Ajax & Clio!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: #1a0a08;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Malibu sunset sky — warm reds, yellows, lifeguard vibes */
  .sky {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg,
      #1a0520 0%,
      #4a1535 12%,
      #8b2040 24%,
      #d44030 36%,
      #f08030 46%,
      #ffc040 54%,
      #f09030 62%,
      #d04535 70%,
      #6b2050 80%,
      #1e2060 90%,
      #0a1030 100%);
    z-index: 0;
  }

  /* Big Malibu sun */
  .sun {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8e0 0%, #ffd040 35%, #ff6030 70%, transparent 100%);
    box-shadow: 0 0 80px rgba(255,200,60,0.5), 0 0 150px rgba(255,120,40,0.3);
    z-index: 1;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { box-shadow: 0 0 80px rgba(255,200,60,0.5), 0 0 150px rgba(255,120,40,0.3); }
    50% { box-shadow: 0 0 100px rgba(255,200,60,0.6), 0 0 180px rgba(255,120,40,0.4); }
  }

  /* Lifeguard tower silhouette */
  .tower {
    position: fixed;
    z-index: 2;
    bottom: 20%;
    opacity: 0.2;
    filter: brightness(0.15);
    font-size: 90px;
  }
  .tower-left { left: 3%; }
  .tower-right { right: 5%; font-size: 60px; bottom: 22%; }

  /* Palm trees */
  .palm {
    position: fixed;
    bottom: 18%;
    z-index: 2;
    font-size: 75px;
    opacity: 0.25;
    filter: brightness(0.15);
  }
  .palm-left { left: 12%; }
  .palm-right { right: 12%; }

  /* Flying birds */
  .bird {
    position: fixed;
    z-index: 2;
    font-size: 16px;
    opacity: 0.35;
    animation: birdFly linear infinite;
  }
  @keyframes birdFly {
    0% { transform: translateX(-10vw) translateY(0); }
    25% { transform: translateX(20vw) translateY(-10px); }
    50% { transform: translateX(50vw) translateY(5px); }
    75% { transform: translateX(75vw) translateY(-8px); }
    100% { transform: translateX(110vw) translateY(0); }
  }

  /* Ocean */
  .ocean {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 20%;
    z-index: 1;
    overflow: hidden;
  }
  .ocean-base {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(20,50,100,0.5) 0%, #0a1030 100%);
  }

  /* Rolling waves */
  .wave {
    position: absolute;
    width: 200%;
    height: 50px;
    left: -50%;
    animation: waveRoll linear infinite;
  }
  .wave svg { width: 100%; height: 100%; }
  .wave1 { bottom: 75%; animation-duration: 8s; opacity: 0.12; }
  .wave2 { bottom: 55%; animation-duration: 10s; opacity: 0.18; animation-delay: -3s; }
  .wave3 { bottom: 35%; animation-duration: 7s; opacity: 0.22; animation-delay: -5s; }
  .wave4 { bottom: 15%; animation-duration: 9s; opacity: 0.28; animation-delay: -1s; }
  .wave5 { bottom: 0%; animation-duration: 6s; opacity: 0.32; animation-delay: -4s; }
  @keyframes waveRoll {
    0% { transform: translateX(0); }
    100% { transform: translateX(50%); }
  }

  /* Floating lifeguard items */
  .float-item {
    position: fixed;
    z-index: 2;
    font-size: 26px;
    opacity: 0.18;
    animation: floatItem ease-in-out infinite;
  }
  @keyframes floatItem {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  /* Screen flash overlay */
  .screen-flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .screen-flash.correct { background: radial-gradient(circle, rgba(76,175,80,0.3), transparent 70%); opacity: 1; }
  .screen-flash.wrong { background: radial-gradient(circle, rgba(229,57,53,0.3), transparent 70%); opacity: 1; }
  .screen-flash.streak { background: radial-gradient(circle, rgba(255,215,0,0.4), transparent 70%); opacity: 1; }

  /* Main content */
  .game-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 620px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2em;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,80,40,0.6), 0 0 30px rgba(255,60,30,0.3);
    margin: 15px 0 5px;
    text-align: center;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 1.1em;
    color: #ffc080;
    text-shadow: 0 0 10px rgba(255,180,80,0.4);
    margin-bottom: 10px;
  }

  /* Score bar */
  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 10px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,80,40,0.15);
    border-radius: 50px;
    margin-bottom: 10px;
    color: white;
    font-weight: 900;
    font-size: 1.05em;
    backdrop-filter: blur(8px);
  }
  .score-bar .stars-area { font-size: 1.3em; letter-spacing: 2px; }

  /* Rescue progress bar */
  .wave-progress {
    width: 100%;
    height: 36px;
    background: rgba(180,40,30,0.2);
    border-radius: 18px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,80,40,0.2);
  }
  .wave-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #d32f2f, #f44336, #ff7043);
    border-radius: 18px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    min-width: 40px;
  }
  .wave-progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 200%; height: 100%;
    background: repeating-linear-gradient(90deg,
      transparent 0px,
      rgba(255,255,255,0.1) 10px,
      transparent 20px);
    animation: waveShimmer 1.5s linear infinite;
  }
  @keyframes waveShimmer {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }
  .surfboard-rider {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  /* Timer bar */
  .timer-bar-container {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    transition: width 0.1s linear, background-color 0.3s;
    background: #4caf50;
  }

  /* Question card */
  .question-card {
    background: rgba(20, 10, 15, 0.78);
    border: 1px solid rgba(255,80,40,0.12);
    border-radius: 24px;
    padding: 25px;
    width: 100%;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    animation: cardEnter 0.4s ease-out;
  }
  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Question type badge */
  .q-type-badge {
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .badge-character { background: linear-gradient(90deg, #d32f2f, #f44336); color: white; }
  .badge-quote { background: linear-gradient(90deg, #f57c00, #ff9800); color: white; }
  .badge-plot { background: linear-gradient(90deg, #1976d2, #2196f3); color: white; }
  .badge-truefalse { background: linear-gradient(90deg, #388e3c, #4caf50); color: white; }

  /* Character display */
  .character-display {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    position: relative;
    overflow: visible;
  }
  .char-ring {
    position: absolute;
    top: -6px; left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: rgba(255,80,40,0.8);
    border-right-color: rgba(255,200,60,0.5);
    animation: ringRotate 3s linear infinite;
  }
  .char-ring2 {
    position: absolute;
    top: -10px; left: -10px;
    width: calc(100% + 20px);
    height: calc(100% + 20px);
    border-radius: 50%;
    border: 1px solid transparent;
    border-bottom-color: rgba(255,200,60,0.4);
    border-left-color: rgba(255,80,40,0.3);
    animation: ringRotate 5s linear infinite reverse;
  }
  @keyframes ringRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .char-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 3px solid rgba(255,80,40,0.4);
    box-shadow: 0 0 30px rgba(255,80,40,0.2), inset 0 0 40px rgba(0,0,0,0.4);
  }
  .char-emoji {
    font-size: 65px;
    z-index: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    animation: emojiEntrance 0.5s ease-out;
  }
  @keyframes emojiEntrance {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .char-detail {
    font-size: 9px;
    color: rgba(255,255,255,0.8);
    font-weight: 900;
    text-align: center;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 2;
  }

  /* Quote display */
  .quote-display {
    font-size: 1.2em;
    color: #ffd0a0;
    font-style: italic;
    text-align: center;
    margin: 10px 0 15px;
    padding: 15px 20px;
    border-left: 3px solid rgba(255,80,40,0.5);
    background: rgba(255,80,40,0.06);
    border-radius: 0 12px 12px 0;
    line-height: 1.6;
    max-width: 95%;
  }
  .quote-display::before { content: '\201C'; font-size: 1.8em; color: rgba(255,80,40,0.4); margin-right: 4px; }
  .quote-display::after { content: '\201D'; font-size: 1.8em; color: rgba(255,80,40,0.4); margin-left: 4px; }

  .question-text {
    font-size: 1.15em;
    color: #f0d0c0;
    margin-bottom: 15px;
    text-align: center;
    line-height: 1.5;
    max-width: 95%;
    font-weight: 900;
  }

  .hint-text {
    font-size: 0.92em;
    color: #c0a090;
    font-style: italic;
    margin-bottom: 15px;
    min-height: 22px;
    text-align: center;
    line-height: 1.5;
    max-width: 90%;
  }

  /* Divider */
  .divider {
    width: 70%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,80,40,0.4), rgba(255,200,60,0.4), transparent);
    margin: 8px 0 15px;
    position: relative;
  }
  .divider::after {
    content: '🛟';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
  }

  /* Answer buttons */
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .answer-btn {
    padding: 16px 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05em;
    font-weight: 900;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(40,15,20,0.85), rgba(60,25,30,0.85));
    cursor: pointer;
    transition: all 0.2s;
    color: #f0d0c0;
    position: relative;
    overflow: hidden;
  }
  .answer-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,80,40,0.1), transparent);
    transition: left 0.4s;
  }
  .answer-btn:hover::before { left: 100%; }
  .answer-btn:hover {
    transform: scale(1.04);
    border-color: rgba(255,80,40,0.4);
    box-shadow: 0 0 20px rgba(255,80,40,0.12);
  }
  .answer-btn:active { transform: scale(0.97); }
  .answer-btn.correct {
    background: linear-gradient(135deg, rgba(46,125,50,0.8), rgba(76,175,80,0.6));
    border-color: #66bb6a;
    color: white;
    box-shadow: 0 0 30px rgba(76,175,80,0.4);
    animation: correctPop 0.5s ease;
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, rgba(183,28,28,0.7), rgba(229,57,53,0.5));
    border-color: #ef5350;
    color: white;
    box-shadow: 0 0 30px rgba(229,57,53,0.4);
    animation: shake 0.4s ease;
  }
  @keyframes correctPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Hint button */
  .hint-btn {
    margin-top: 12px;
    padding: 8px 22px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9em;
    font-weight: 900;
    border: 1px solid rgba(255,200,60,0.3);
    border-radius: 30px;
    background: rgba(255,200,60,0.1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #ffd060;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hint-btn:hover {
    background: rgba(255,200,60,0.2);
    border-color: rgba(255,200,60,0.5);
    box-shadow: 0 0 15px rgba(255,200,60,0.15);
  }

  /* Explanation box */
  .explanation-box {
    margin-top: 14px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,200,60,0.2);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    width: 100%;
    animation: fadeSlideIn 0.35s ease-out;
  }
  .explanation-box .expl-header {
    font-size: 0.85em;
    font-weight: 900;
    color: #ffd060;
    margin-bottom: 6px;
  }
  .explanation-box .expl-text {
    font-size: 0.95em;
    color: #e0c8b8;
    line-height: 1.5;
  }
  @keyframes fadeSlideIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Lifebuoy flip on correct */
  .buoy-flip {
    position: fixed;
    font-size: 50px;
    z-index: 55;
    pointer-events: none;
    animation: buoyFlip 1s ease-out forwards;
  }
  @keyframes buoyFlip {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    40% { transform: translateY(-60px) rotate(360deg) scale(1.3); opacity: 1; }
    100% { transform: translateY(-120px) rotate(720deg) scale(0.5); opacity: 0; }
  }

  /* Result overlay */
  .result-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: rgba(10, 5, 8, 0.88);
    backdrop-filter: blur(8px);
    overflow-y: auto;
  }
  .result-overlay.show { display: flex; }

  .result-card {
    background: linear-gradient(180deg, rgba(40,15,20,0.98), rgba(20,10,15,0.98));
    border: 1px solid rgba(255,80,40,0.3);
    border-radius: 28px;
    padding: 40px 30px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 50px rgba(255,80,40,0.1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes resultPop {
    0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .result-card h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 2em;
    margin-bottom: 10px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,80,40,0.5);
  }
  .result-card .big-emoji { font-size: 80px; margin: 15px 0; }
  .result-card .score-text { font-size: 1.3em; color: #ffc080; margin: 10px 0; }
  .result-card .message { font-size: 1.1em; color: #c0a090; margin-bottom: 25px; line-height: 1.4; }

  .play-btn {
    padding: 16px 45px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3em;
    background: linear-gradient(135deg, #d32f2f, #f44336);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 5px 20px rgba(255,80,40,0.4);
    position: relative;
    overflow: hidden;
  }
  .play-btn::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .play-btn:hover::after { opacity: 1; }
  .play-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,80,40,0.5); }
  .play-btn:active { transform: translateY(1px); }

  /* Start screen */
  .start-screen {
    text-align: center;
    padding: 30px 20px;
  }
  .start-screen .big-emoji {
    font-size: 100px;
    margin: 20px 0;
    animation: rescueBounce 3s ease-in-out infinite;
  }
  @keyframes rescueBounce {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-15px); }
  }
  .start-screen p { font-size: 1.2em; color: #ffc080; text-shadow: 0 0 10px rgba(255,180,80,0.3); margin-bottom: 12px; }
  .logo-text {
    font-family: 'Fredoka One', cursive;
    font-size: 0.55em;
    color: #ff7043;
    text-shadow: 0 0 15px rgba(255,112,67,0.5);
    display: block;
    margin-top: -5px;
  }

  /* Player select */
  .player-select {
    display: flex;
    gap: 16px;
    margin: 18px 0 10px;
    justify-content: center;
  }
  .player-btn {
    padding: 14px 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2em;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0d0c0;
    cursor: pointer;
    transition: all 0.25s;
  }
  .player-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,80,40,0.4);
    transform: translateY(-2px);
  }
  .player-btn.selected {
    background: linear-gradient(135deg, rgba(211,47,47,0.5), rgba(244,67,54,0.4));
    border-color: #ff7043;
    color: white;
    box-shadow: 0 0 25px rgba(255,80,40,0.3);
    transform: scale(1.06);
  }

  .highscore-display {
    font-size: 0.95em;
    color: #c0a090;
    margin-bottom: 12px;
    min-height: 24px;
  }

  /* New record glow */
  .new-record {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3em;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.7), 0 0 40px rgba(255,215,0,0.4);
    animation: newRecordGlow 1s ease-in-out infinite alternate;
    margin: 8px 0;
  }
  @keyframes newRecordGlow {
    0% { text-shadow: 0 0 20px rgba(255,215,0,0.7), 0 0 40px rgba(255,215,0,0.4); }
    100% { text-shadow: 0 0 30px rgba(255,215,0,0.9), 0 0 60px rgba(255,215,0,0.6), 0 0 80px rgba(255,160,0,0.3); }
  }

  /* Review button */
  .review-btn {
    margin-top: 16px;
    padding: 12px 30px;

// ===== SOUND ENGINE (Web Audio API - Lifeguard Themed) =====
let audioCtx = null;
let soundEnabled = true;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('vol-btn').textContent = soundEnabled ? '🔊' : '🔇';
}

function playNote(freq, duration, type, volume, delay) {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(volume || 0.12, ctx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration);
}

function playCorrect() {
  // Lifeguard whistle — bright ascending
  playNote(440.00, 0.1, 'sine', 0.14, 0);

  const notes = [523, 523, 659, 783, 783, 659, 783, 1047, 1319];

    playNote(n * 1.5, durs[i], 'sine', 0.04, t);
    t += durs[i] * 0.65;
  });
}

// ===== GAME STATE =====
let currentRound = 0;
let score = 0;
let streak = 0;
let roundResults = [];
let gameQuestions = [];
let selectedPlayer = null;
let hintUsed = false;
let timerInterval = null;
let timerRemaining = 0;
let answerLocked = false;
let missedQuestions = [];
const TOTAL_ROUNDS = 15;
const TIMER_SECONDS = 20;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== PLAYER SELECTION =====
function selectPlayer(name) {
  selectedPlayer = name;
  document.getElementById('btn-ajax').classList.toggle('selected', name === 'Ajax');
  document.getElementById('btn-clio').classList.toggle('selected', name === 'Clio');
  const startBtn = document.getElementById('start-btn');
  startBtn.style.opacity = '1';
  startBtn.style.pointerEvents = 'auto';
  playClick();
  updateHighscoreDisplay();
}

function getHighscore(name) {
  if (!name) return 0;
  return parseInt(localStorage.getItem('malibu-rescue-highscore-' + name) || '0', 10);
}

function setHighscore(name, val) {
  if (!name) return;
  localStorage.setItem('malibu-rescue-highscore-' + name, val.toString());
}

function updateHighscoreDisplay() {
  const el = document.getElementById('highscore-display');
  if (!selectedPlayer) {
    el.textContent = '';
    return;
  }
  const hs = getHighscore(selectedPlayer);
  if (hs > 0) {
    el.textContent = 'Ρεκόρ ' + selectedPlayer + ': ' + hs;
  } else {
    el.textContent = selectedPlayer + ' — πρώτο παιχνίδι!';
  }
}

// ===== TIMER =====
function startTimer() {
  timerRemaining = TIMER_SECONDS * 10; // tenths of a second
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  bar.style.backgroundColor = '#4caf50';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    const pct = (timerRemaining / (TIMER_SECONDS * 10)) * 100;
    bar.style.width = pct + '%';
    // Color transition: green → yellow → red
    if (pct > 50) {
      bar.style.backgroundColor = '#4caf50';
    } else if (pct > 25) {
      bar.style.backgroundColor = '#ffc107';
    } else {
      bar.style.backgroundColor = '#f44336';
    }
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 100);
}

function pauseTimer() {
  clearInterval(timerInterval);
}

function handleTimeout() {
  if (answerLocked) return;
  answerLocked = true;
  playTimeout();
  screenFlash('wrong');
  streak = 0;
  hideStreak();

  const q = gameQuestions[currentRound];
  roundResults.push(false);

  // Record missed question
  missedQuestions.push({
    question: q.type === 'quote' ? ('"' + q.quote + '" — ' + q.question) : q.question,
    answered: 'Τέλειωσε ο χρόνος!',
    correct: q.answer,
    explanation: q.explanation
  });

  // Highlight correct answer
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => {
    b.onclick = null;
    if (b.textContent === q.answer) b.classList.add('correct');
  });

  // Show explanation
  showExplanation(q.explanation);

  // Remove hint button
  document.getElementById('hint-btn-area').innerHTML = '';

  document.getElementById('score-display').textContent = 'Σκορ: ' + score;
  updateStars();
  updateProgress();

  setTimeout(() => {
    currentRound++;
    if (currentRound >= TOTAL_ROUNDS) {
      showResults();
    } else {
      showRound();
    }
  }, 2400);
}

// ===== VISUAL EFFECTS =====
function screenFlash(type) {
  const el = document.getElementById('screen-flash');
  el.className = 'screen-flash ' + type;
  setTimeout(() => el.className = 'screen-flash', 400);
}

function spawnSparkles(x, y) {
  const sparkles = ['🛟', '🏊', '🐬', '🌊', '☀️', '🏖️', '🐚'];
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
    const angle = (Math.PI * 2 * i) / 8;
    const dist = 40 + Math.random() * 60;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: 'translate(' + tx + 'px, ' + ty + 'px) scale(0.3)', opacity: 0 }
    ], { duration: 700, easing: 'ease-out', fill: 'forwards' });
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}

function spawnBuoyFlip(x, y) {
  const b = document.createElement('div');
  b.className = 'buoy-flip';
  b.textContent = '🛟';
  b.style.left = x + 'px';
  b.style.top = y + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1000);
}

function showExplanation(text) {
  const area = document.getElementById('explanation-area');
  area.innerHTML = '<div class="explanation-box"><div class="expl-header">💡 Εξήγηση</div><div class="expl-text">' + text + '</div></div>';
}

// ===== GAME FLOW =====
function startGame() {
  if (!selectedPlayer) return;
  playGameStart();
  currentRound = 0;
  score = 0;
  streak = 0;
  roundResults = [];
  missedQuestions = [];

  // Build 15 questions: 5 character + 3 quote + 4 plot + 3 truefalse
  const chars = shuffle(CHAR_QUESTIONS).slice(0, 5);
  const quotes = shuffle(QUOTE_QUESTIONS).slice(0, 3);
  const plots = shuffle(PLOT_QUESTIONS).slice(0, 4);
  const tfs = shuffle(TF_QUESTIONS).slice(0, 3);

  gameQuestions = shuffle([...chars, ...quotes, ...plots, ...tfs]);

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result-overlay').classList.remove('show');

  const gs = document.getElementById('game-screen');
  gs.style.display = 'flex';

  updateProgress();
  setTimeout(() => showRound(), 300);
}

function updateProgress() {
  const pct = Math.max(6.6, ((currentRound) / TOTAL_ROUNDS) * 100);
  document.getElementById('wave-progress-fill').style.width = pct + '%';
}

function showRound() {
  playNewRound();
  answerLocked = false;
  hintUsed = false;
  const q = gameQuestions[currentRound];

  // Clear explanation and hint areas
  document.getElementById('explanation-area').innerHTML = '';
  document.getElementById('hint-btn-area').innerHTML = '';

  // Re-trigger card animation
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'cardEnter 0.4s ease-out';

  const badge = document.getElementById('q-type-badge');
  const charArea = document.getElementById('character-area');
  const quoteArea = document.getElementById('quote-area');
  const questionText = document.getElementById('question-text');
  const hintText = document.getElementById('hint-text');

  charArea.style.display = 'none';
  quoteArea.style.display = 'none';

  if (q.type === 'character') {
    badge.textContent = 'ΧΑΡΑΚΤΗΡΑΣ';
    badge.className = 'q-type-badge badge-character';
    document.getElementById('game-title').textContent = 'Ποιος Είναι;';
    charArea.style.display = 'block';
    const inner = document.getElementById('char-inner');
    inner.style.background = q.bg;
    inner.innerHTML = '<div class="char-detail">' + q.detail + '</div><div class="char-emoji">' + q.emoji + '</div>';
    questionText.textContent = q.question;
    hintText.textContent = q.hint;
  } else if (q.type === 'quote') {
    badge.textContent = 'ΑΤΑΚΑ';
    badge.className = 'q-type-badge badge-quote';
    document.getElementById('game-title').textContent = 'Ποιος το Είπε;';
    quoteArea.style.display = 'block';
    document.getElementById('quote-text').textContent = q.quote;
    questionText.textContent = q.question;
    hintText.textContent = '';
  } else if (q.type === 'plot') {
    badge.textContent = 'ΙΣΤΟΡΙΑ';
    badge.className = 'q-type-badge badge-plot';
    document.getElementById('game-title').textContent = 'Trivia!';
    questionText.textContent = q.question;
    hintText.textContent = q.hint || '';
  } else if (q.type === 'truefalse') {
    badge.textContent = 'ΑΛΗΘΕΙΑ / ΨΕΜΑ';
    badge.className = 'q-type-badge badge-truefalse';
    document.getElementById('game-title').textContent = 'Σωστό ή Λάθος;';
    questionText.textContent = q.question;
    hintText.textContent = '';
  }

  // Build answer options
  let options;
  if (q.type === 'truefalse') {
    options = shuffle([q.answer, ...q.decoys]);
  } else {
    options = shuffle([q.answer, ...q.decoys.slice(0, 3)]);
  }

  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';
  answersEl.style.gridTemplateColumns = '1fr 1fr';

  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt;
    btn.style.opacity = '0';
    btn.style.transform = 'translateY(15px)';
    btn.style.transition = 'opacity 0.3s, transform 0.3s';
    btn.onclick = () => { playClick(); handleAnswer(btn, opt, q); };
    answersEl.appendChild(btn);
    setTimeout(() => {
      btn.style.opacity = '1';
      btn.style.transform = 'translateY(0)';
    }, 200 + idx * 80);
  });

  // Add hint button if hint2 exists
  if (q.hint2) {
    const hintBtnArea = document.getElementById('hint-btn-area');
    const hintBtn = document.createElement('button');
    hintBtn.className = 'hint-btn';
    hintBtn.textContent = '💡 Βοήθεια';
    hintBtn.onclick = () => {
      hintUsed = true;
      hintText.textContent = q.hint2;
      hintBtn.remove();
      playClick();
    };
    hintBtnArea.appendChild(hintBtn);
  }

  document.getElementById('score-display').textContent = 'Σκορ: ' + score;
  document.getElementById('round-display').textContent = (currentRound + 1) + ' / ' + TOTAL_ROUNDS;
  updateStars();
  updateProgress();

  // Start timer
  startTimer();
}

function handleAnswer(btn, selected, q) {
  if (answerLocked) return;
  answerLocked = true;
  pauseTimer();

  const correct = q.answer;
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    playCorrect();
    screenFlash('correct');
    streak++;
    let points = streak >= 3 ? 20 : 10;
    if (hintUsed) points = Math.floor(points / 2);
    score += points;
    roundResults.push(true);

    const rect = btn.getBoundingClientRect();
    spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    spawnBuoyFlip(rect.left + rect.width / 2 - 25, rect.top - 10);

    if (streak >= 3) {
      showStreak();
      playStreak();
      screenFlash('streak');
    }

    showFloatingPoints(btn, points);
  } else {
    btn.classList.add('wrong');
    playWrong();
    screenFlash('wrong');
    streak = 0;
    roundResults.push(false);
    hideStreak();

    buttons.forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });

    // Record missed question
    missedQuestions.push({
      question: q.type === 'quote' ? ('"' + q.quote + '" — ' + q.question) : q.question,
      answered: selected,
      correct: correct,
      explanation: q.explanation
    });

    // Show explanation on wrong answer
    showExplanation(q.explanation);
  }

  // Remove hint button after answering
  document.getElementById('hint-btn-area').innerHTML = '';

  document.getElementById('score-display').textContent = 'Σκορ: ' + score;
  updateStars();
  updateProgress();

  setTimeout(() => {
    currentRound++;
    if (currentRound >= TOTAL_ROUNDS) {
      showResults();
    } else {
      showRound();
    }
  }, selected === correct ? 1600 : 2400);
}

function showFloatingPoints(btn, points) {
  const rect = btn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-points';
  el.textContent = '+' + points;
  el.style.left = (rect.left + rect.width / 2 - 20) + 'px';
  el.style.top = rect.top + 'px';
  el.style.color = points >= 20 ? '#ffd700' : '#ff7043';
  el.style.textShadow = points >= 20
    ? '0 0 15px rgba(255,215,0,0.6)'
    : '0 0 12px rgba(255,112,67,0.5)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function updateStars() {
  const correctCount = roundResults.filter(r => r).length;
  const stars = document.getElementById('stars-display');
  if (correctCount >= 9) stars.textContent = '\u2B50\u2B50\u2B50';
  else if (correctCount >= 7) stars.textContent = '\u2B50\u2B50';
  else if (correctCount >= 4) stars.textContent = '\u2B50';
  else stars.textContent = '';
}

function showStreak() {
  const el = document.getElementById('streak');
  el.textContent = streak + 'x Rescue!';
  el.className = 'streak show';
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'streakPulse 0.6s ease-in-out';
}

function hideStreak() {
  document.getElementById('streak').classList.remove('show');
}

function showResults() {
  pauseTimer();
  const overlay = document.getElementById('result-overlay');
  const correctCount = roundResults.filter(r => r).length;
  const percentage = Math.round((correctCount / TOTAL_ROUNDS) * 100);

  let emoji, title, message;
  const name = selectedPlayer || '';

  if (percentage === 100) {
    emoji = '🏆';
    title = 'ΤΕΛΕΙΟ ΣΚΟΡ!';
    message = 'Απίστευτο ' + name + '! Γνωρίζεις τα πάντα για το Malibu Rescue!';
    playVictory();
    launchConfetti();
  } else if (percentage >= 80) {
    emoji = '🛟';
    title = 'Μπράβο ' + name + '!';
    message = 'Εξαιρετικά! Είσαι σχεδόν επαγγελματίας ναυαγοσώστης!';
    playVictory();
    launchConfetti();
  } else if (percentage >= 60) {
    emoji = '🏊';
    title = 'Καλός Κολυμβητής!';
    message = 'Μπράβο ' + name + '! Δοκίμασε ξανά για ακόμα καλύτερο σκορ!';
    playCorrect();
  } else if (percentage >= 40) {
    emoji = '🏖️';
    title = 'Στην Παραλία!';
    message = name + ', χρειάζεσαι λίγη ακόμα εξάσκηση! Δες ξανά μερικά επεισόδια!';
  } else {
    emoji = '💪';
    title = 'Μην τα Παρατάς ' + name + '!';
    message = 'Ξαναδές τη σειρά και δοκίμασε ξανά!';
  }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').textContent = correctCount + '/' + TOTAL_ROUNDS + ' σωστά — Σκορ: ' + score;
  document.getElementById('result-message').textContent = message;

  // High score check
  const newRecordArea = document.getElementById('new-record-area');
  const prevHigh = getHighscore(selectedPlayer);
  if (score > prevHigh) {
    setHighscore(selectedPlayer, score);
    if (prevHigh > 0) {
      newRecordArea.innerHTML = '<div class="new-record">🏆 Νέο Ρεκόρ! 🏆</div>';
    } else {
      newRecordArea.innerHTML = '<div class="new-record">Πρώτο Σκορ!</div>';
    }
  } else {
    newRecordArea.innerHTML = '';
  }

  // Review button — show only if there are missed questions
  const reviewBtn = document.getElementById('review-btn');
  const reviewList = document.getElementById('review-list');
  reviewList.style.display = 'none';
  reviewList.innerHTML = '';
  if (missedQuestions.length > 0) {
    reviewBtn.style.display = 'inline-block';
  } else {
    reviewBtn.style.display = 'none';
  }

  overlay.classList.add('show');
  hideStreak();
}

function toggleReview() {
  const reviewList = document.getElementById('review-list');
  if (reviewList.style.display === 'none') {
    // Build review items
    let html = '';
    missedQuestions.forEach((mq, i) => {
      html += '<div class="review-item">';
      html += '<div class="rq">' + (i + 1) + '. ' + mq.question + '</div>';
      html += '<div class="ra">Απάντησες: ' + mq.answered + '</div>';
      html += '<div class="rc">Σωστό: ' + mq.correct + '</div>';
      html += '<div class="re">💡 ' + mq.explanation + '</div>';
      html += '</div>';
    });
    reviewList.innerHTML = html;
    reviewList.style.display = 'block';
    document.getElementById('review-btn').textContent = 'Κρύψε τα Λάθη';
  } else {
    reviewList.style.display = 'none';
    document.getElementById('review-btn').textContent = 'Δες τα Λάθη';
  }
}

function launchConfetti() {
  // Lifeguard-themed confetti
  const emojis = ['🛟', '🏊', '🏊‍♀️', '🐬', '🌊', '☀️', '🏖️', '🐚', '🦈', '🌴', '🏄', '🐠'];
  for (let i = 0; i < 45; i++) {
    setTimeout(() => {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      conf.style.fontSize = (18 + Math.random() * 16) + 'px';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 5000);
    }, i * 80);
  }
}

// Init highscore display on load
updateHighscoreDisplay();
