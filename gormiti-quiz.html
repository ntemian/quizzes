// ===== BACKGROUND ANIMATION =====
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

class Particle{
  constructor(){this.reset()}
  reset(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.size=Math.random()*3+1;
    this.speedX=(Math.random()-0.5)*0.8;
    this.speedY=(Math.random()-0.5)*0.8;
    this.opacity=Math.random()*0.5+0.2;
    this.hue=Math.random()>0.5?(Math.random()>0.5?130:45):280;
    this.pulse=Math.random()*Math.PI*2;
  }
  update(){
    this.x+=this.speedX;this.y+=this.speedY;this.pulse+=0.02;
    const o=this.opacity+Math.sin(this.pulse)*0.15;
    if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.reset();
    return o;
  }
  draw(o){
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.hue},80%,65%,${Math.max(0,o)})`;ctx.fill();
  }
}
for(let i=0;i<80;i++)particles.push(new Particle());

let bgTime=0;
function drawBg(){
  bgTime+=0.003;
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  const h1=280+Math.sin(bgTime)*15;
  const h2=140+Math.sin(bgTime+1)*20;
  g.addColorStop(0,`hsl(${h1},60%,12%)`);
  g.addColorStop(0.5,`hsl(${(h1+h2)/2},50%,15%)`);
  g.addColorStop(1,`hsl(${h2},55%,10%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{const o=p.update();p.draw(o)});
  requestAnimationFrame(drawBg);
}
drawBg();

// ===== AUDIO ENGINE =====
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function playNote(freq,start,dur,type='triangle',vol=0.12){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+start+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+dur);
}
function sfxCorrect(){[523,659,784,1047].forEach((f,i)=>playNote(f,i*0.08,0.3,'triangle',0.1))}
function sfxWrong(){[400,300].forEach((f,i)=>playNote(f,i*0.15,0.35,'sawtooth',0.06))}
function sfxStreak(){[523,587,659,698,784,880,988,1047].forEach((f,i)=>playNote(f,i*0.06,0.25,'triangle',0.08))}
function sfxVictory(){[523,659,784,659,784,1047,784,1047,1319].forEach((f,i)=>playNote(f,i*0.12,0.4,'triangle',0.09))}
function sfxClick(){playNote(800,0,0.08,'sine',0.06)}
function sfxNewRound(){[440,523,659].forEach((f,i)=>playNote(f,i*0.1,0.2,'sine',0.05))}
function sfxTimeout(){[350,280,220].forEach((f,i)=>playNote(f,i*0.12,0.3,'sawtooth',0.05))}

// ===== GAME STATE =====
let state={player:'',score:0,streak:0,currentQ:0,selectedQs:[],mistakes:[],hintUsed:false,timer:null,timeLeft:20,answered:false,highscores:{}};

// ===== FISHER-YATES SHUFFLE =====
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== SELECT QUESTIONS =====
function selectQuestions(){
  const chars=shuffle(questions.character).slice(0,5).map(q=>({...q,type:'character'}));
  const quotes=shuffle(questions.quote).slice(0,3).map(q=>({...q,type:'quote'}));
  const plots=shuffle(questions.plot).slice(0,4).map(q=>({...q,type:'plot'}));
  const tfs=shuffle(questions.tf).slice(0,3).map(q=>({...q,type:'tf'}));
  return shuffle([...chars,...quotes,...plots,...tfs]);
}

// ===== FLASH EFFECT =====
function flash(color){
  const el=document.getElementById('flash');
  el.className='flash-overlay flash-'+color;
  el.style.opacity='1';
  setTimeout(()=>{el.style.opacity='0'},400);
}

// ===== SPARKLES =====
function spawnSparkles(x,y){
  const emojis=['⭐','✨','💎','🔥','🌿'];
  for(let i=0;i<8;i++){
    const s=document.createElement('div');s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(x+Math.random()*80-40)+'px';
    s.style.top=(y+Math.random()*60-30)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

// ===== CONFETTI =====
function spawnConfetti(){
  const colors=['#4ade80','#fbbf24','#a855f7','#f472b6','#60a5fa','#f97316'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='confetti-piece';
    c.style.left=Math.random()*100+'vw';
    c.style.top='-10px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.width=(Math.random()*8+6)+'px';
    c.style.height=(Math.random()*8+6)+'px';
    c.style.animationDuration=(Math.random()*2+2)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// ===== TIMER =====
function startTimer(){
  state.timeLeft=20;state.answered=false;
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    if(state.answered)return clearInterval(state.timer);
    state.timeLeft-=0.1;
    const pct=(state.timeLeft/20)*100;
    const bar=document.getElementById('timerBar');
    const txt=document.getElementById('timerText');
    if(bar){
      bar.style.width=pct+'%';
      bar.className='timer-bar'+(state.timeLeft<=5?' danger':state.timeLeft<=10?' warning':'');
    }
    if(txt)txt.textContent=Math.ceil(state.timeLeft)+'s';
    if(state.timeLeft<=0){
      clearInterval(state.timer);state.timeLeft=0;
      if(!state.answered)handleTimeout();
    }
  },100);
}

function handleTimeout(){
  state.answered=true;sfxTimeout();flash('red');
  const q=state.selectedQs[state.currentQ];
  state.streak=0;
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach((b,i)=>{
    b.classList.add('disabled');
    if(q.type==='tf'){
      if((i===0&&q.correct===true)||(i===1&&q.correct===false))b.classList.add('reveal');
    } else {
      if(i===q.correct)b.classList.add('reveal');
    }
  });
  const hintBtn=document.querySelector('.hint-btn');if(hintBtn)hintBtn.style.display='none';
  state.mistakes.push({q,given:'⏰ Τέλος χρόνου!',correctAnswer:q.type==='tf'?(q.correct?'Αλήθεια':'Ψέμα'):q.options[q.correct]});
  showExplanation(q);
  setTimeout(()=>nextQuestion(),3000);
}

// ===== START GAME =====
function startGame(player){
  sfxClick();ensureAudio();
  state={player,score:0,streak:0,currentQ:0,selectedQs:selectQuestions(),mistakes:[],hintUsed:false,timer:null,timeLeft:20,answered:false,
    highscores:JSON.parse(localStorage.getItem('gormiti-highscores')||'{}')};
  sfxNewRound();renderQuestion();
}

// ===== RENDER QUESTION =====
function renderQuestion(){
  if(state.currentQ>=state.selectedQs.length)return renderResult();
  const q=state.selectedQs[state.currentQ];
  const total=state.selectedQs.length;
  const pct=((state.currentQ)/total)*100;
  state.hintUsed=false;state.answered=false;

  let badge='',badgeClass='';
  if(q.type==='character'){badge='ΧΑΡΑΚΤΗΡΑΣ';badgeClass='badge-char'}
  else if(q.type==='quote'){badge='ΑΤΑΚΑ';badgeClass='badge-quote'}
  else if(q.type==='plot'){badge='ΙΣΤΟΡΙΑ';badgeClass='badge-plot'}
  else{badge='ΑΛΗΘΕΙΑ / ΨΕΜΑ';badgeClass='badge-tf'}

  let charBlock='';
  if(q.type==='character'){
    charBlock=`<div class="char-display"><span class="char-emoji" style="background:${q.bg};border-radius:20px;padding:10px 20px;display:inline-block">${q.emoji}</span><span class="char-tag">${q.tag}</span></div>`;
  }

  let quoteBlock='';
  if(q.type==='quote'){
    quoteBlock=`<div style="text-align:center;padding:16px;margin-bottom:14px;border-radius:16px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15)"><p style="color:#fde68a;font-size:1.15em;font-style:italic;font-weight:700">${q.quote}</p></div>`;
  }

  let questionText=q.type==='tf'?q.statement:q.question;
  let optionsHTML='';

  if(q.type==='tf'){
    optionsHTML=`<div class="options-grid" style="grid-template-columns:1fr 1fr">
      <button class="option-btn" onclick="answer(0,this)" style="text-align:center;font-size:1.2em">✅ Αλήθεια</button>
      <button class="option-btn" onclick="answer(1,this)" style="text-align:center;font-size:1.2em">❌ Ψέμα</button>
    </div>`;
  } else {
    const shuffledOpts=q.options.map((o,i)=>({text:o,origIdx:i}));
    // Shuffle options but track correct index
    for(let i=shuffledOpts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffledOpts[i],shuffledOpts[j]]=[shuffledOpts[j],shuffledOpts[i]]}
    q._shuffled=shuffledOpts;
    q._correctShuffled=shuffledOpts.findIndex(o=>o.origIdx===q.correct);
    optionsHTML=`<div class="options-grid">${shuffledOpts.map((o,i)=>`<button class="option-btn" onclick="answer(${i},this)">${o.text}</button>`).join('')}</div>`;
  }

  let hintBtn='';
  if(q.hint||q.hint2){
    hintBtn=`<button class="hint-btn" id="hintBtn" onclick="useHint()">💡 Βοήθεια</button><div class="hint-box" id="hintBox"></div>`;
  }

  const riders=['🐉','⚔️','🔥','🌿','🌊','💨','🏰','⭐'];
  const rider=riders[state.currentQ%riders.length];

  document.getElementById('app').innerHTML=`
    <div class="glass question-screen">
      <div class="top-bar">
        <span class="player-name">${state.player==='Ajax'?'🦁':'🦋'} ${state.player}</span>
        <span class="score-display">⭐ ${state.score}</span>
      </div>
      ${state.streak>=3?`<div class="streak-display" style="text-align:center;margin-bottom:8px">🔥 Streak x${state.streak}! (2x πόντοι!)</div>`:''}
      <div class="progress-container">
        <div class="progress-bar" style="width:${pct}%">
          <span class="progress-rider">${rider}</span>
        </div>
      </div>
      <div class="timer-text" id="timerText">20s</div>
      <div class="timer-container"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
      <span class="badge ${badgeClass}">${badge}</span>
      ${charBlock}${quoteBlock}
      <p class="question-text">${q.type==='tf'?'Αλήθεια ή Ψέμα;':''} ${questionText}</p>
      ${optionsHTML}
      ${hintBtn}
      <div id="explanationArea"></div>
      <p style="color:rgba(255,255,255,0.35);font-size:.8em;text-align:center;margin-top:14px">${state.currentQ+1} / ${total}</p>
    </div>`;
  startTimer();
}

// ===== USE HINT =====
function useHint(){
  sfxClick();
  const q=state.selectedQs[state.currentQ];
  const hintBox=document.getElementById('hintBox');
  const hintBtn=document.getElementById('hintBtn');
  if(!state.hintUsed){
    state.hintUsed=true;
    hintBox.textContent='💡 '+q.hint;
    hintBox.classList.add('visible');
    if(q.hint2){
      hintBtn.textContent='💡 Ακόμα Βοήθεια';
      hintBtn.onclick=()=>{
        hintBox.textContent='💡 '+q.hint2;
        hintBtn.classList.add('used');
      };
    } else {
      hintBtn.classList.add('used');
    }
  }
}

// ===== ANSWER =====
function answer(idx,el){
  if(state.answered)return;
  state.answered=true;clearInterval(state.timer);sfxClick();

  const q=state.selectedQs[state.currentQ];
  let isCorrect=false;

  if(q.type==='tf'){
    isCorrect=(idx===0&&q.correct===true)||(idx===1&&q.correct===false);
  } else {
    isCorrect=idx===q._correctShuffled;
  }

  const btns=document.querySelectorAll('.option-btn');

  if(isCorrect){
    el.classList.add('correct');
    state.streak++;
    const pts=state.hintUsed?5:(state.streak>=3?20:10);
    state.score+=pts;
    sfxCorrect();
    if(state.streak>=3){flash('gold');sfxStreak()}else{flash('green')}
    const rect=el.getBoundingClientRect();
    spawnSparkles(rect.left+rect.width/2,rect.top);
  } else {
    el.classList.add('wrong');
    state.streak=0;
    flash('red');sfxWrong();
    // Show correct
    if(q.type==='tf'){
      btns.forEach((b,i)=>{if((i===0&&q.correct===true)||(i===1&&q.correct===false))b.classList.add('reveal')});
      state.mistakes.push({q,given:idx===0?'Αλήθεια':'Ψέμα',correctAnswer:q.correct?'Αλήθεια':'Ψέμα'});
    } else {
      btns[q._correctShuffled].classList.add('reveal');
      state.mistakes.push({q,given:q._shuffled[idx].text,correctAnswer:q.options[q.correct]});
    }
  }

  btns.forEach(b=>b.classList.add('disabled'));
  const hintBtn=document.getElementById('hintBtn');if(hintBtn)hintBtn.style.display='none';

  showExplanation(q);
  setTimeout(()=>nextQuestion(),isCorrect?1800:3000);
}

// ===== SHOW EXPLANATION =====
function showExplanation(q){
  const area=document.getElementById('explanationArea');
  if(area&&q.explanation){
    area.innerHTML=`<div class="explanation-box"><span class="icon">💡</span><p>${q.explanation}</p></div>`;
  }
}

// ===== NEXT QUESTION =====
function nextQuestion(){
  state.currentQ++;sfxNewRound();renderQuestion();
}

// ===== RENDER RESULT =====
function renderResult(){
  clearInterval(state.timer);
  const total=state.selectedQs.length;
  const correct=total-state.mistakes.length;
  const pct=Math.round((correct/total)*100);
  let stars=0;
  if(correct>=9)stars=3;else if(correct>=7)stars=2;else if(correct>=4)stars=1;
  const starsHTML=Array(3).fill(0).map((_,i)=>`<span class="star">${i<stars?'⭐':'☆'}</span>`).join('');

  if(pct>=80){sfxVictory();spawnConfetti()}
  else if(stars>0)sfxVictory();

  // High score
  const key=state.player;
  const prevHigh=state.highscores[key]||0;
  const isNewRecord=state.score>prevHigh;
  if(isNewRecord){
    state.highscores[key]=state.score;
    localStorage.setItem('gormiti-highscores',JSON.stringify(state.highscores));
  }

  let msgLine='';
  if(pct>=90)msgLine='🐉 Θρυλικός Άρχοντας του Gorm!';
  else if(pct>=70)msgLine='⚔️ Μεγάλος Γκορμίτι Πολεμιστής!';
  else if(pct>=50)msgLine='🌿 Καλός Μαθητευόμενος!';
  else msgLine='🔥 Προσπάθησε ξανά, ήρωα!';

  document.getElementById('app').innerHTML=`
    <div class="glass result-screen">
      <h2>${msgLine}</h2>
      <div class="score-big">${state.score}</div>
      <p style="color:rgba(255,255,255,0.6);margin-top:4px">πόντοι</p>
      <div class="stars-display">${starsHTML}</div>
      <p style="color:#c4b5fd;font-size:1.05em">${correct} / ${total} σωστές</p>
      ${isNewRecord?`<div class="highscore-badge">🎉 Νέο Ρεκόρ!</div>`:''}
      <p style="color:rgba(255,255,255,0.4);font-size:.85em;margin-top:6px">Ρεκόρ ${state.player}: ${state.highscores[key]} πόντοι</p>
      <div class="result-btns">
        <button class="result-btn btn-replay" onclick="startGame('${state.player}')">🔄 Ξανά!</button>
        ${state.mistakes.length>0?`<button class="result-btn btn-review" onclick="toggleReview()">📝 Δες τα Λάθη</button>`:''}
        <button class="result-btn btn-review" onclick="renderStart()">🏠 Αρχή</button>
      </div>
      <div id="reviewPanel" class="review-panel" style="display:none"></div>
    </div>`;
}

// ===== REVIEW MISTAKES =====
function toggleReview(){
  const panel=document.getElementById('reviewPanel');
  if(panel.style.display==='none'){
    panel.style.display='block';
    panel.innerHTML=state.mistakes.map(m=>`
      <div class="review-item">
        <p class="q">${m.q.type==='tf'?m.q.statement:m.q.question}</p>
        <p class="wrong-a">❌ Απάντησες: ${m.given}</p>
        <p class="correct-a">✅ Σωστό: ${m.correctAnswer}</p>
        <p class="expl">💡 ${m.q.explanation}</p>
      </div>`).join('');
  } else {
    panel.style.display='none';
  }
}

// ===== INIT =====
renderStart();
</script>
</body>
</html>
